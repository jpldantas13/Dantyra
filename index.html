                        "primary-light": "var(--color-primary-light, #5b3cf5)",

    <style>
        :root {
            --color-primary: #3713ec;
            --color-primary-light: #5b3cf5;
            --color-primary-rgb: 55, 19, 236;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        .dark ::-webkit-scrollbar-track {
            background: #131022;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db; 
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #292348;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-primary); 
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark .glass-panel {
            background: rgba(41, 35, 72, 0.6);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Remove setinhas de inputs numéricos */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: white !important;
                color: black !important;
                overflow: visible !important;
            }
            #root > div > aside,
            #root > div > main > header,
            #root > div > main > div:not(#report-content) {
                display: none !important;
            }
            #root > div > main {
                overflow: visible !important;
                height: auto !important;
            }
            #report-content {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                max-width: none !important;
                height: auto !important;
                max-height: none !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
                color: black !important;
            }
            @page {
                size: A4;
                margin: 1cm;
            }
        }
    </style>
